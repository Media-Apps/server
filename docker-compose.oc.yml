## Deployment compose for ownCloud server rollout.
# Use this file on target hosts for deploy; do not use it as local dev stack.
services:
  owncloud:
    image: ghcr.io/media-apps/server:debian13
    container_name: owncloud_server
    restart: always
    ports:
      - "8080:80"
    depends_on:
      init_chown:
        condition: service_completed_successfully
      mysql_dhi:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      APACHE_DOCUMENT_ROOT: /var/www/owncloud
      APACHE_LISTEN: "80"
      APACHE_SERVER_NAME: localhost
      APACHE_SERVER_ADMIN: admin@example.local
      APACHE_ERROR_LOG: /proc/self/fd/2
      APACHE_ACCESS_LOG: /proc/self/fd/1
      APACHE_LOG_FORMAT: combined
      OWNCLOUD_DOMAIN: ${OWNCLOUD_DOMAIN}
      OWNCLOUD_TRUSTED_DOMAINS: ${OWNCLOUD_TRUSTED_DOMAINS}
      OWNCLOUD_DB_TYPE: mysql
      OWNCLOUD_DB_NAME: owncloud
      OWNCLOUD_DB_USERNAME: owncloud
      OWNCLOUD_DB_PASSWORD: owncloud
      OWNCLOUD_DB_HOST: mysql_dhi
      OWNCLOUD_ADMIN_USERNAME: ${ADMIN_USERNAME}
      OWNCLOUD_ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      OWNCLOUD_MYSQL_UTF8MB4: "true"
      OWNCLOUD_REDIS_ENABLED: "true"
      OWNCLOUD_REDIS_HOST: redis
      OWNCLOUD_SUB_URL: ${OWNCLOUD_SUB_URL}
      OWNCLOUD_SKIP_CHOWN: "true"
    healthcheck:
      test: ["CMD", "/usr/bin/healthcheck"]
      interval: 30s
      timeout: 10s
      retries: 5
    volumes:
      - files:/mnt/data
    networks:
      - homecloud_network
      - oc_network

  init_chown:
    image: ghcr.io/media-apps/server:debian13
    container_name: owncloud_init_chown
    restart: "no"
    user: "0:0"
    entrypoint: ["/usr/bin/init-chown"]
    environment:
      OWNCLOUD_SKIP_CHOWN: "false"
      OWNCLOUD_SKIP_CHMOD: "false"
    volumes:
      - files:/mnt/data
    networks:
      - oc_network

  mysql_dhi:
    image: dhi.io/mysql:8.0
    restart: always
    environment:
      - MYSQL_ROOT_PASSWORD=owncloud
      - MYSQL_OPTIONS=--max_allowed_packet=128M
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-u", "root", "--password=owncloud"]
      interval: 10s
      timeout: 5s
      retries: 10
    volumes:
      - mysql:/var/lib/mysql
    networks:
      - oc_network
      
  mysql_bootstrap:
    image: dhi.io/mysql:8.0
    depends_on:
      mysql_dhi:
        condition: service_healthy
    entrypoint: ["/bin/bash", "-lc"]
    command: >
      "set -euo pipefail;
      /opt/mysql/bin/mysql -hmysql_dhi -uroot -powncloud -e
      \"CREATE DATABASE IF NOT EXISTS owncloud;
      CREATE USER IF NOT EXISTS 'owncloud'@'%' IDENTIFIED WITH mysql_native_password BY 'owncloud';
      ALTER USER 'owncloud'@'%' IDENTIFIED WITH mysql_native_password BY 'owncloud';
      GRANT ALL PRIVILEGES ON owncloud.* TO 'owncloud'@'%';
      FLUSH PRIVILEGES;\""
    restart: "no"
    networks:
      - oc_network

  redis:
    image: dhi.io/valkey:8
    restart: always
    command: ["--databases", "1", "--protected-mode", "no"]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping || valkey-cli ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - redis:/data
    networks:
      - oc_network

  cron:
    image: ghcr.io/media-apps/server:debian13
    container_name: owncloud_cron
    restart: always
    depends_on:
      owncloud:
        condition: service_healthy
    entrypoint: ["/usr/bin/entrypoint"]
    user: "33:33"
    command:
      - "/bin/sh"
      - "-c"
      - "while true; do /usr/bin/owncloud /usr/bin/cronjob; sleep 60; done"
    environment:
      OWNCLOUD_BACKGROUND_MODE: cron
      OWNCLOUD_CROND_ENABLED: "false"
      OWNCLOUD_DOMAIN: ${OWNCLOUD_DOMAIN}
      OWNCLOUD_DB_TYPE: mysql
      OWNCLOUD_DB_NAME: owncloud
      OWNCLOUD_DB_USERNAME: owncloud
      OWNCLOUD_DB_PASSWORD: owncloud
      OWNCLOUD_DB_HOST: mariadb
      OWNCLOUD_REDIS_ENABLED: "true"
      OWNCLOUD_REDIS_HOST: redis
    volumes:
      - files:/mnt/data
    networks:
      - oc_network

volumes:
  files:
  mysql:
  redis:

networks:
  homecloud_network:
    external: true
  oc_network:
    external: true

## Deployment compose for ownCloud server rollout.
# Use this file on target hosts for deploy; do not use it as local dev stack.
services:
  owncloud:
    image: owncloud/server:24.04-dhi
    container_name: owncloud_server
    restart: always
    ports:
      - "8080:80"
    depends_on:
      init_chown:
        condition: service_completed_successfully
      mariadb:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      APACHE_DOCUMENT_ROOT: /var/www/owncloud
      APACHE_LISTEN: "80"
      APACHE_SERVER_NAME: localhost
      APACHE_SERVER_ADMIN: admin@example.local
      APACHE_ERROR_LOG: /proc/self/fd/2
      APACHE_ACCESS_LOG: /proc/self/fd/1
      APACHE_LOG_FORMAT: combined
      OWNCLOUD_DOMAIN: ${OWNCLOUD_DOMAIN}
      OWNCLOUD_TRUSTED_DOMAINS: ${OWNCLOUD_TRUSTED_DOMAINS}
      OWNCLOUD_DB_TYPE: mysql
      OWNCLOUD_DB_NAME: owncloud
      OWNCLOUD_DB_USERNAME: owncloud
      OWNCLOUD_DB_PASSWORD: owncloud
      OWNCLOUD_DB_HOST: mariadb
      OWNCLOUD_ADMIN_USERNAME: ${ADMIN_USERNAME}
      OWNCLOUD_ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      OWNCLOUD_MYSQL_UTF8MB4: "true"
      OWNCLOUD_REDIS_ENABLED: "true"
      OWNCLOUD_REDIS_HOST: redis
      OWNCLOUD_SUB_URL: ${OWNCLOUD_SUB_URL}
    healthcheck:
      test: ["CMD", "/usr/bin/healthcheck"]
      interval: 30s
      timeout: 10s
      retries: 5
    volumes:
      - files:/mnt/data
    networks:
      - homecloud_network
      - oc_network

  init_chown:
    image: owncloud/server:24.04-dhi
    container_name: owncloud_init_chown
    restart: "no"
    user: "0:0"
    entrypoint: ["/usr/bin/init-chown"]
    environment:
      OWNCLOUD_SKIP_CHOWN: "false"
      OWNCLOUD_SKIP_CHMOD: "false"
    volumes:
      - files:/mnt/data
    networks:
      - oc_network

  mariadb:
    image: mariadb:10.11
    container_name: owncloud_mariadb
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: owncloud
      MYSQL_USER: owncloud
      MYSQL_PASSWORD: owncloud
      MYSQL_DATABASE: owncloud
      MARIADB_AUTO_UPGRADE: "1"
    command: ["--max-allowed-packet=128M", "--innodb-log-file-size=64M"]
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-u", "root", "--password=owncloud"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - mysql:/var/lib/mysql
    networks:
      - oc_network

  redis:
    image: redis:6
    container_name: owncloud_redis
    restart: always
    command: ["--databases", "1"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - redis:/data
    networks:
      - oc_network

  cron:
    image: owncloud/server:24.04-dhi
    container_name: owncloud_cron
    restart: always
    depends_on:
      owncloud:
        condition: service_healthy
    entrypoint: ["/usr/bin/entrypoint"]
    user: "33:33"
    command:
      - "/bin/sh"
      - "-c"
      - "while true; do /usr/bin/owncloud /usr/bin/cronjob; sleep 60; done"
    environment:
      OWNCLOUD_BACKGROUND_MODE: cron
      OWNCLOUD_CROND_ENABLED: "false"
      OWNCLOUD_DOMAIN: ${OWNCLOUD_DOMAIN}
      OWNCLOUD_DB_TYPE: mysql
      OWNCLOUD_DB_NAME: owncloud
      OWNCLOUD_DB_USERNAME: owncloud
      OWNCLOUD_DB_PASSWORD: owncloud
      OWNCLOUD_DB_HOST: mariadb
      OWNCLOUD_REDIS_ENABLED: "true"
      OWNCLOUD_REDIS_HOST: redis
    volumes:
      - files:/mnt/data
    networks:
      - oc_network

volumes:
  files:
  mysql:
  redis:

networks:
  homecloud_network:
    external: true
  oc_network:
    external: true

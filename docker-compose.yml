## Local development compose (build + validation stack).
# Use this file for local testing and image validation workflows.
# For deployment use `docker-compose.oc.yml`.
volumes:
  files:
    driver: local
  mysql_dhi:
    driver: local
  redis:
    driver: local

services:
  owncloud:
    build:
      context: ./vdebian13
      dockerfile: Dockerfile.multiarch
      args:
        - TARBALL_URL=https://download.owncloud.com/server/stable/owncloud-${OWNCLOUD_BUNDLE_VERSION}.tar.bz2
    image: owncloud/server:${OWNCLOUD_IMAGE_TAG}
    restart: always
    ports:
      - ${HTTP_PORT}:80
    depends_on:
      init_chown:
        condition: service_completed_successfully
      mysql_dhi:
        condition: service_healthy
      mysql_bootstrap:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    environment:
      - APACHE_LISTEN=80
      - OWNCLOUD_DOMAIN=${OWNCLOUD_DOMAIN}
      - OWNCLOUD_TRUSTED_DOMAINS=${OWNCLOUD_TRUSTED_DOMAINS}
      - OWNCLOUD_DB_TYPE=mysql
      - OWNCLOUD_DB_NAME=owncloud
      - OWNCLOUD_DB_USERNAME=owncloud
      - OWNCLOUD_DB_PASSWORD=owncloud
      - OWNCLOUD_DB_HOST=mysql_dhi
      # ownCloud 11+ may require pcntl helpers during install/upgrade; keep pcntl_* enabled.
      - OWNCLOUD_PHP_DISABLE_FUNCTIONS=system,phpinfo,show_source,fopen_with_path,dbmopen,dbase_open,filepro_retrieve,posix_mkfifo
      - OWNCLOUD_ADMIN_USERNAME=${ADMIN_USERNAME}
      - OWNCLOUD_ADMIN_PASSWORD=${ADMIN_PASSWORD}
      - OWNCLOUD_MYSQL_UTF8MB4=true
      - OWNCLOUD_REDIS_ENABLED=true
      - OWNCLOUD_REDIS_HOST=redis
      - OWNCLOUD_SKIP_CHOWN=true
    healthcheck:
      test: ["CMD", "/usr/bin/healthcheck"]
      interval: 30s
      timeout: 10s
      retries: 5
    volumes:
      - files:/mnt/data

  init_chown:
    image: owncloud/server:${OWNCLOUD_IMAGE_TAG}
    user: "0:0"
    restart: "no"
    entrypoint: ["/usr/bin/init-chown"]
    environment:
      - OWNCLOUD_SKIP_CHOWN=false
      - OWNCLOUD_SKIP_CHMOD=false
    volumes:
      - files:/mnt/data

  mysql_dhi:
    image: dhi.io/mysql:8.0
    restart: always
    environment:
      - MYSQL_ROOT_PASSWORD=owncloud
      - MYSQL_OPTIONS=--max_allowed_packet=128M
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-u", "root", "--password=owncloud"]
      interval: 10s
      timeout: 5s
      retries: 10
    volumes:
      - mysql_dhi:/var/lib/mysql

  mysql_bootstrap:
    image: dhi.io/mysql:8.4
    depends_on:
      mysql_dhi:
        condition: service_healthy
    entrypoint: ["/bin/bash", "-lc"]
    command: >
      "set -euo pipefail;
      /opt/mysql/bin/mysql -hmysql_dhi -uroot -powncloud -e
      \"CREATE DATABASE IF NOT EXISTS owncloud;
      CREATE USER IF NOT EXISTS 'owncloud'@'%' IDENTIFIED WITH mysql_native_password BY 'owncloud';
      ALTER USER 'owncloud'@'%' IDENTIFIED WITH mysql_native_password BY 'owncloud';
      GRANT ALL PRIVILEGES ON owncloud.* TO 'owncloud'@'%';
      FLUSH PRIVILEGES;\""
    restart: "no"

  redis:
    image: dhi.io/valkey:8
    restart: always
    command: ["--databases", "1", "--protected-mode", "no"]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping || valkey-cli ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - redis:/data

  cron:
    image: owncloud/server:${OWNCLOUD_IMAGE_TAG}
    restart: always
    depends_on:
      owncloud:
        condition: service_healthy
    entrypoint: ["/usr/bin/entrypoint"]
    user: "33:33"
    command:
      - "/bin/sh"
      - "-c"
      - "while true; do /usr/bin/owncloud /usr/bin/cronjob; sleep 60; done"
    environment:
      - OWNCLOUD_BACKGROUND_MODE=cron
      - OWNCLOUD_CROND_ENABLED=false
      - OWNCLOUD_DOMAIN=${OWNCLOUD_DOMAIN}
      - OWNCLOUD_DB_TYPE=mysql
      - OWNCLOUD_DB_NAME=owncloud
      - OWNCLOUD_DB_USERNAME=owncloud
      - OWNCLOUD_DB_PASSWORD=owncloud
      - OWNCLOUD_DB_HOST=mysql_dhi
      - OWNCLOUD_REDIS_ENABLED=true
      - OWNCLOUD_REDIS_HOST=redis
      - OWNCLOUD_SKIP_CHOWN=true
    volumes:
      - files:/mnt/data
